<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>成绩正态分布查询</title>
    <link href="asserts/css/bootstrap.min.css" th:href="@{/webjars/bootstrap/4.0.0/css/bootstrap.css}" rel="stylesheet">
    <link href="asserts/css/dashboard.css" th:href="@{/asserts/css/dashboard.css}" rel="stylesheet">
    <!-- 引入Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<!--引入抽取的topbar-->
<div th:replace="commons/teabar::topbar"></div>

<div class="container-fluid">
    <div class="row">
        <!--引入侧边栏-->
        <div th:replace="commons/teabar::#sidebar(activeUri='scoreDistribution')"></div>

        <main role="main" class="col-md-9 ml-sm-auto col-lg-10 pt-3 px-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                <h1 class="h2">成绩正态分布查询</h1>
            </div>

            <form th:action="@{/tea/scoreDistribution}" method="get" class="mb-4">
                <div class="form-group row">
                    <label for="subName" class="col-sm-2 col-form-label">选择课程：</label>
                    <div class="col-sm-6">
                        <select class="form-control" id="subName" name="subName" required>
                            <option value="">--请选择课程--</option>
                            <option th:each="sub : ${subjects}"
                                    th:value="${sub.subName}"
                                    th:text="${sub.subName}"
                                    th:selected="${subName != null && subName == sub.subName}">
                            </option>
                        </select>
                    </div>
                    <div class="col-sm-4">
                        <button type="submit" class="btn btn-primary">查询</button>
                    </div>
                </div>
            </form>

            <div th:if="${errors != null}" class="alert alert-danger">
                <ul class="mb-0">
                    <li th:each="err : ${errors}" th:text="${err.message}"></li>
                </ul>
            </div>

            <div th:if="${scoreDistribution != null}">
                <h4 th:text="'课程：' + ${subName}"></h4>

                <!-- 统计信息 -->
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card text-white bg-primary mb-3">
                            <div class="card-body">
                                <h5 class="card-title">平均分</h5>
                                <p class="card-text" th:text="${#numbers.formatDecimal(scoreDistribution.avgScore, 1, 2)}"></p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-white bg-success mb-3">
                            <div class="card-body">
                                <h5 class="card-title">标准差</h5>
                                <p class="card-text" th:text="${#numbers.formatDecimal(scoreDistribution.stdDev, 1, 2)}"></p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-white bg-info mb-3">
                            <div class="card-body">
                                <h5 class="card-title">最高分</h5>
                                <p class="card-text" th:text="${scoreDistribution.maxScore}"></p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-white bg-warning mb-3">
                            <div class="card-body">
                                <h5 class="card-title">最低分</h5>
                                <p class="card-text" th:text="${scoreDistribution.minScore}"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 图表容器 -->
                <div class="chart-container" style="position: relative; height:400px; width:100%">
                    <canvas id="distributionChart"></canvas>
                </div>

                <!-- 成绩分布表格 -->
                <div class="table-responsive mt-4">
                    <table class="table table-striped table-sm">
                        <thead>
                        <tr>
                            <th>分数段</th>
                            <th>人数</th>
                            <th>占比</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="bucket, stat : ${scoreDistribution.scoreBuckets}">
                            <td th:text="${bucket.range}"></td>
                            <td th:text="${bucket.count}"></td>
                            <td th:text="${#numbers.formatDecimal(bucket.percentage, 1, 2) + '%'}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- JavaScript代码 -->
<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', function() {
        var distributionData = /*[[${scoreDistribution}]]*/ null;
        if (distributionData) {
            drawDistributionChart(distributionData);
        }
    });

    function drawDistributionChart(distributionData) {
        var ctx = document.getElementById('distributionChart').getContext('2d');

        var labels = distributionData.scoreBuckets.map(function(bucket) {
            return bucket.range;
        });

        var actualData = distributionData.scoreBuckets.map(function(bucket) {
            return bucket.count;
        });

        // 计算正态分布曲线数据
        var normalDistributionData = calculateNormalDistribution(
            distributionData.avgScore,
            distributionData.stdDev,
            distributionData.totalCount,
            labels
        );

        var chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: '实际成绩分布',
                        data: actualData,
                        backgroundColor: 'rgba(54, 162, 235, 0.6)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    },
                    {
                        label: '正态分布曲线',
                        data: normalDistributionData,
                        type: 'line',
                        fill: false,
                        backgroundColor: 'rgba(255, 99, 132, 0.6)',
                        borderColor: 'rgba(255, 99, 132, 1)',
                        borderWidth: 2,
                        pointRadius: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: '人数'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: '分数段'
                        }
                    }
                },
                plugins: {
                    title: {
                        display: true,
                        text: '成绩分布与正态分布曲线对比'
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                var label = context.dataset.label || '';
                                if (label) {
                                    label += ': ';
                                }
                                if (context.datasetIndex === 0) {
                                    label += context.parsed.y + '人';
                                } else {
                                    label += context.parsed.y.toFixed(1) + '人(理论值)';
                                }
                                return label;
                            }
                        }
                    }
                }
            }
        });
    }

    function calculateNormalDistribution(mean, stdDev, totalCount, labels) {
        if (stdDev === 0) return labels.map(() => 0);

        var data = [];
        for (var i = 0; i < labels.length; i++) {
            var rangeParts = labels[i].split('-');
            var lower = parseInt(rangeParts[0]);
            var upper = parseInt(rangeParts[1]);

            // 计算分数段的中点值
            var midPoint;
            if (lower === 0 && upper === 59) {
                // 对于0-60分段，使用30作为中点
                midPoint = 30;
            } else {
                midPoint = (lower + upper) / 2;
            }

            // 计算正态分布概率密度函数
            var exponent = -0.5 * Math.pow((midPoint - mean) / stdDev, 2);
            var probability = (1 / (stdDev * Math.sqrt(2 * Math.PI))) * Math.exp(exponent);

            // 转换为期望人数，考虑分数段宽度
            var rangeWidth = upper - lower + 1;
            var expectedCount = probability * totalCount * rangeWidth;
            data.push(expectedCount);
        }
        return data;
    }
    /*]]>*/
</script>
</body>
</html>
