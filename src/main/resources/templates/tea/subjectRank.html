<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>各科成绩查询</title>
    <link href="asserts/css/bootstrap.min.css" th:href="@{/webjars/bootstrap/4.0.0/css/bootstrap.css}" rel="stylesheet">
    <link href="asserts/css/dashboard.css" th:href="@{/asserts/css/dashboard.css}" rel="stylesheet">
</head>
<body>
<!--引入抽取的topbar-->
<div th:replace="commons/teabar::topbar"></div>

<div class="container-fluid">
    <div class="row">
        <!--引入侧边栏-->
        <div th:replace="commons/teabar::#sidebar(activeUri='subjectRank')"></div>

        <main role="main" class="col-md-9 ml-sm-auto col-lg-10 pt-3 px-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                <h1 class="h2">各科成绩查询</h1>
            </div>

            <form th:action="@{/tea/subjectRank}" method="get" class="mb-4">
                <div class="form-group row">
                    <label for="subName" class="col-sm-2 col-form-label">选择课程：</label>
                    <div class="col-sm-6">
                        <select class="form-control" id="subName" name="subName" required>
                            <option value="">--请选择课程--</option>
                            <option th:each="sub : ${subjects}"
                                    th:value="${sub.subName}"
                                    th:text="${sub.subName}"
                                    th:selected="${subName != null && subName == sub.subName}">
                            </option>
                        </select>
                    </div>
                    <div class="col-sm-4">
                        <button type="submit" class="btn btn-primary">查询</button>
                    </div>
                </div>
            </form>

            <div th:if="${errors != null}" class="alert alert-danger">
                <ul class="mb-0">
                    <li th:each="err : ${errors}" th:text="${err.message}"></li>
                </ul>
            </div>

            <div th:if="${subjectRanks != null}">
                <h4 th:text="'课程：' + ${subName}"></h4>

                <div class="table-responsive">
                    <table class="table table-striped table-sm">
                        <thead>
                        <tr>
                            <th>排名</th>
                            <th>学号</th>
                            <th>姓名</th>
                            <th>成绩</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="rank, stat : ${subjectRanks}">
                            <td th:text="${stat.count}"></td>
                            <td th:text="${rank.stuId}"></td>
                            <td th:text="${rank.stuName}"></td>
                            <td th:text="${rank.resNum}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="alert alert-info mt-3">
                    <strong>平均分：</strong>
                    <span th:text="${avgScore}"></span>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
