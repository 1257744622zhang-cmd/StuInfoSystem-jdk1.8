<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>班级各科平均分图表</title>
    <link href="asserts/css/bootstrap.min.css" th:href="@{/webjars/bootstrap/4.0.0/css/bootstrap.css}" rel="stylesheet">
    <link href="asserts/css/dashboard.css" th:href="@{/asserts/css/dashboard.css}" rel="stylesheet">
    <!-- 引入Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<!--引入抽取的topbar-->
<div th:replace="commons/teabar::topbar"></div>

<div class="container-fluid">
    <div class="row">
        <!--引入侧边栏-->
        <div th:replace="commons/teabar::#sidebar(activeUri='classSubjectAvgChart')"></div>

        <main role="main" class="col-md-9 ml-sm-auto col-lg-10 pt-3 px-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                <h1 class="h2">班级各科平均分图表</h1>
            </div>

            <form th:action="@{/tea/classSubjectAvgChart}" method="get" class="mb-4">
                <div class="form-group row">
                    <label for="className" class="col-sm-2 col-form-label">选择班级：</label>
                    <div class="col-sm-6">
                        <select class="form-control" id="className" name="className" required>
                            <option value="">--请选择班级--</option>
                            <option th:each="cls : ${classes}"
                                    th:value="${cls.className}"
                                    th:text="${cls.className}"
                                    th:selected="${className != null && className == cls.className}">
                            </option>
                        </select>
                    </div>
                    <div class="col-sm-4">
                        <button type="submit" class="btn btn-primary">查询</button>
                    </div>
                </div>
            </form>

            <div th:if="${errors != null}" class="alert alert-danger">
                <ul class="mb-0">
                    <li th:each="err : ${errors}" th:text="${err.message}"></li>
                </ul>
            </div>

            <div th:if="${classSubjectAvgs != null}">
                <h4 th:text="'班级：' + ${className}"></h4>

                <!-- 统计信息 -->
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card text-white bg-primary mb-3">
                            <div class="card-body">
                                <h5 class="card-title">总平均分</h5>
                                <p class="card-text" th:text="${#numbers.formatDecimal(totalAvgScore, 1, 2)}"></p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-white bg-success mb-3">
                            <div class="card-body">
                                <h5 class="card-title">科目数量</h5>
                                <p class="card-text" th:text="${subjectCount}"></p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-white bg-info mb-3">
                            <div class="card-body">
                                <h5 class="card-title">最高平均分</h5>
                                <p class="card-text" th:text="${highestAvgSubject} + ': ' + ${#numbers.formatDecimal(highestAvgScore, 1, 2)}"></p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-white bg-warning mb-3">
                            <div class="card-body">
                                <h5 class="card-title">最低平均分</h5>
                                <p class="card-text" th:text="${lowestAvgSubject} + ': ' + ${#numbers.formatDecimal(lowestAvgScore, 1, 2)}"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 图表容器 -->
                <div class="chart-container mb-4" style="position: relative; height:400px; width:100%">
                    <canvas id="subjectAvgChart"></canvas>
                </div>

                <!-- 数据表格 -->
                <div class="table-responsive">
                    <table class="table table-striped table-sm">
                        <thead>
                        <tr>
                            <th>课程名称</th>
                            <th>平均分</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="subjectAvg : ${classSubjectAvgs}">
                            <td th:text="${subjectAvg.subName}"></td>
                            <td th:text="${#numbers.formatDecimal(subjectAvg.avgScore, 1, 2)}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Chart.js 脚本 -->
                <script th:inline="javascript">
                    /*<![CDATA[*/
                    var subjectAvgs = /*[[${classSubjectAvgs}]]*/ [];
                    var subjectNames = subjectAvgs.map(function(item) { return item.subName; });
                    var avgScores = subjectAvgs.map(function(item) { return item.avgScore; });

                    var ctx = document.getElementById('subjectAvgChart').getContext('2d');
                    var chart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: subjectNames,
                            datasets: [{
                                label: '平均分',
                                data: avgScores,
                                backgroundColor: 'rgba(54, 162, 235, 0.5)',
                                borderColor: 'rgba(54, 162, 235, 1)',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    max: 100,
                                    title: {
                                        display: true,
                                        text: '平均分'
                                    }
                                },
                                x: {
                                    title: {
                                        display: true,
                                        text: '科目'
                                    }
                                }
                            },
                            plugins: {
                                title: {
                                    display: true,
                                    text: '班级各科平均分统计'
                                }
                            }
                        }
                    });
                    /*]]>*/
                </script>
            </div>
        </main>
    </div>
</div>
</body>
</html>
