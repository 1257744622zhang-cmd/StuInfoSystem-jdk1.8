<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>班级平均分查询</title>
    <link href="asserts/css/bootstrap.min.css" th:href="@{/webjars/bootstrap/4.0.0/css/bootstrap.css}" rel="stylesheet">
    <link href="asserts/css/dashboard.css" th:href="@{/asserts/css/dashboard.css}" rel="stylesheet">
</head>
<body>
<!--引入抽取的topbar-->
<div th:replace="commons/teabar::topbar"></div>

<div class="container-fluid">
    <div class="row">
        <!--引入侧边栏-->
        <div th:replace="commons/teabar::#sidebar(activeUri='classAvgScore')"></div>

        <main role="main" class="col-md-9 ml-sm-auto col-lg-10 pt-3 px-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                <h1 class="h2">班级平均分查询</h1>
            </div>

            <form th:action="@{/tea/classAvgScore}" method="get" class="mb-4">
                <div class="form-group row">
                    <label for="className" class="col-sm-2 col-form-label">选择班级：</label>
                    <div class="col-sm-6">
                        <select class="form-control" id="className" name="className" required>
                            <option value="">--请选择班级--</option>
                            <option th:each="cls : ${classes}"
                                    th:value="${cls.className}"
                                    th:text="${cls.className}"
                                    th:selected="${className != null && className == cls.className}">
                            </option>
                        </select>
                    </div>
                    <div class="col-sm-4">
                        <button type="submit" class="btn btn-primary">查询</button>
                    </div>
                </div>
            </form>

            <div th:if="${errors != null}" class="alert alert-danger">
                <ul class="mb-0">
                    <li th:each="err : ${errors}" th:text="${err.message}"></li>
                </ul>
            </div>

            <div th:if="${classAvgScores != null}">
                <h4 th:text="'班级：' + ${className}"></h4>

                <div class="table-responsive">
                    <table class="table table-striped table-sm">
                        <thead>
                        <tr>
                            <th>课程名称</th>
                            <th>平均分</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="avgScore : ${classAvgScores}">
                            <td th:text="${avgScore.subName}"></td>
                            <td th:text="${#numbers.formatDecimal(avgScore.avgScore, 1, 2)}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="alert alert-info mt-3">
                    <strong>班级总平均分：</strong>
                    <span th:text="${#numbers.formatDecimal(totalAvgScore, 1, 2)}"></span>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
